{% extends "base.html" %}
{% block title %}Cadastro de Colaborador · Instituto Saber Social{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white rounded-3xl border border-slate-200 shadow-sm p-8 sm:p-10">
  <div class="mb-6">
    <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-blue-50 text-blue-700 text-xs font-semibold uppercase tracking-wider mb-2">
      <i class="ph-bold ph-user-plus"></i>
      <span>Equipe Multidisciplinar</span>
    </div>
    <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Registrar Colaborador</h1>
    <p class="text-sm text-slate-500">Cadastre um novo orientador ou membro da equipe técnica da unidade.</p>
  </div>

  <form action="" method="post" class="space-y-4">
    <div>
      <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
        Nome Completo
      </label>
      <input type="text" name="nomeForm" required
             placeholder="Ex: Amanda Ferreira da Silva"
             class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm text-slate-800 focus:border-blue-700 focus:ring-4 focus:ring-blue-100 outline-none transition">
    </div>

    <div>
      <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
        E-mail Institucional
      </label>
      <input type="email" name="emailForm" required
             placeholder="amanda@sede.com"
             class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm text-slate-800 focus:border-blue-700 focus:ring-4 focus:ring-blue-100 outline-none transition">
    </div>

    <div>
      <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
        Senha de Acesso
      </label>
      <input type="password" name="senhaForm" required
             placeholder="Crie uma senha segura"
             class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm text-slate-800 focus:border-blue-700 focus:ring-4 focus:ring-blue-100 outline-none transition">
    </div>

    <div>
      <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
        Cargo / Função
      </label>
      <select name="cargoForm" class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm text-slate-800 bg-white focus:border-blue-700 focus:ring-4 focus:ring-blue-100 outline-none transition">
        <option value="coordenador">Coordenador(a)</option>
        <option value="psicologa">Psicólogo(a)</option>
        <option value="social">Assistente Social</option>
        <option value="orientador">Orientador(a) Socioeducativo</option>
      </select>
    </div>

    <div class="pt-4">
      <button type="submit"
              class="w-full rounded-xl bg-blue-800 hover:bg-blue-700 text-white font-bold py-3.5 text-sm shadow-md transition">
        Concluir Cadastro
      </button>
    </div>
  </form>
</div>
{% endblock %}
