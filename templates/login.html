<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Instituto Saber Social</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { brand: "#2E7D32", brandDark: "#1B5E20" } } } };
  </script>
</head>
<body class="min-h-screen flex items-center justify-center p-4
             bg-gradient-to-br from-brandDark to-brand">
  <div class="w-full max-w-sm bg-white rounded-2xl shadow-xl p-8">
    <div class="text-center mb-6">
      <div class="mx-auto mb-3 h-14 w-14 rounded-full bg-brand text-white flex items-center justify-center text-2xl font-bold">
        S
      </div>
      <h1 class="text-xl font-bold text-brandDark">Instituto Saber Social</h1>
      <p class="text-sm text-gray-500 mt-1">Chamada digital · faça login para continuar</p>
    </div>

    {% if error %}
      <div class="mb-4 rounded-md bg-red-50 text-red-700 border border-red-200 px-4 py-3 text-sm text-center">
        {{ error }}
      </div>
    {% endif %}

    <form method="post" action="{{ url_for('auth.login') }}" class="space-y-4">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
        <input type="email" name="email" id="email" required autofocus
               autocomplete="username" inputmode="email"
               class="w-full rounded-lg border-2 border-gray-200 px-3 py-3 text-base
                      focus:border-brand focus:outline-none">
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
        <input type="password" name="password" id="password" required
               autocomplete="current-password"
               class="w-full rounded-lg border-2 border-gray-200 px-3 py-3 text-base
                      focus:border-brand focus:outline-none">
      </div>
      <button type="submit"
              class="w-full rounded-lg bg-brand text-white font-semibold py-3 text-base
                     hover:bg-brandDark transition">
        Entrar
      </button>
    </form>
  </div>
</body>
</html>
